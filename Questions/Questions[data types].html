<html>

<head>

</head>

<body>
    <font color="FFFFFF"></font>
    <H1>
        <form name="types1">
            <font color="#000000">
                <div align="center">Тест по теме "Типы данных"</div>
    </H1>
    </font>
    <br>
    <br>
    <A href="..\index.html"><input type="button" name="nazad" value="Назад на главную"></A>
    <br>
    <br>
    №1
    <br>
    <br>
    <label>
        Каким типом данных обладает x = int ?
    </label>
    <br>
    <input type="radio" name="a1" id="a11">
    <label>Строка</label>
    <br>
    <input type="radio" name="a1" id="a21">
    <label>Целое число</label>
    <br>
    <input type="radio" name="a1" id="a31">
    <label>Число с плавающей точкой</label>
    <br>
    <br>
    №2
    <br>
    <div class="Ex1">
        <img
            src="..\Pictures\[data types] task 2.png">
    </div>
    <br>
    <label>
        Какой это тип данных?
    </label>
    <br>
    <br>
    <input type="text" placeholder="Ответ" name="otvet1" size="25" id="c11">
    <br>
    <br>
    №3
    <br>
    <div class="Ex3">
        <img
            src="..\Pictures\[data types] task 3.png">
    </div>
    <br>
    <label>
        X использует какой тип данных?
    </label>
    <br>
    <input type="radio" name="d1" id="d11">
    <label>Никакой</label>
    <br>
    <input type="radio" name="d1" id="d21">
    <label>Строку</label>
    <br>
    <input type="radio" name="d1" id="d31">
    <label>Число</label>
    <br>
    <br>
    <div>
        <button onclick="b1()">Проверить результат</button>
    </div>
    </form>
    <script>
        function b1() {
            let bal = 0;
            if (types1.a21.checked == true) bal += 1;
            if (types1.a21.value == "Целое число") bal += 1;
            if (types1.c11.checked == true) bal += 1;
            if (types1.c11.value == "Число с плавающей точкой") bal += 1;
            if (types1.d11.checked == true) bal += 1;
            if (types1.d11.value == "Никакой") bal += 1;
            alert(`Количество баллов: ${bal}`);
        }
    </script>

</body>
