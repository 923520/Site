<html>

<head>
    <title>Вопросы по теме"Условные операторы"</title>
</head>

<body>
    <font color="FFFFFF"></font>
    <H1>
        <form name="operator1">
            <font color="#000000">
                <div align="center">Тест по теме"Условные операторы"</div>
    </H1>
    </font>
    <br>
    <br>
    <A href="..\index.html"><input type="button" name="nazad" value="Назад на главную"></A>
    <br>
    <br>
    №1
    <br>
    <br>
    <label>
        Что делает if?
    </label>
    <br>
    <br>
    <input type="text" placeholder="Ответ" name="j1" size="30" id="j11">
    <br>
    <br>
    №2
    <br>
    <br>
    <label>
        Что делает else?
    </label>
    <br>
    <br>
    <input type="text" placeholder="Ответ" name="k1" size="30" id="k11">
    <br>
    <br>
    №3
    <br>
    <br>
    <label>
        Что делает elif?
    </label>
    <br>
    <br>
    <input type="text" placeholder="Ответ" name="l1" size="30" id="l11">
    <br>
    <br>
    <div>
        <button onclick="m1()">Проверить результат</button>
    </div>
    </form>
    <script>
        function m1() {
            let balll = 0;
            if (operator1.j11.checked == true) balll += 1;
            if (operator1.j11.value == "Задает условие, при котором часть кода будет исполняться") balll += 1;
            if (operator1.k11.checked == true) balll += 1;
            if (operator1.k11.value == "Исполняет блок кода, если условие не выполнено") balll += 1;
            if (operator1.l11.checked == true) balll += 1;
            if (operator1.l11.value == "Выполняет функции if и else одновременно") balll += 1;
            alert(`Количество баллов: ${balll}`);
        }
    </script>
</body>

</html>
